name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          port: ${{ secrets.VM_PORT }}
          script: |
            set -e

            APP_DIR="/opt/ta-forecasting"
            REPO_URL="https://github.com/HafizMuhammadAlIkhsan/ta-forecasting-application.git"

            mkdir -p $APP_DIR
            cd $APP_DIR

            if [ ! -d ".git" ]; then
              git clone $REPO_URL .
            else
              git pull origin main
            fi

            cat > .env << 'EOF'
            ${{ secrets.ENV_FILE }}
            EOF

            docker compose up -d --build

            until docker exec flask_app true 2>/dev/null; do
              echo "Waiting for container..."
              sleep 2
            done

            docker exec flask_app flask db-reset