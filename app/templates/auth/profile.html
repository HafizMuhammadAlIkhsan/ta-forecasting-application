{% extends "base.html" %}
{% block title %}Profil{% endblock %}

{% block content %}
<div style="padding: 2rem 2.5rem;">

    <div class="mb-4">
        <h4 class="fw-bold mb-1">Profil Pengguna</h4>
        <p class="text-muted small mb-0">Kelola Keamanan Akun</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card bg-white text-dark shadow-sm mb-4"
                style="border-radius: 20px; border: 1px solid #e3e8f0;">
                <div class="card-body">
                    <h6 class="text-uppercase mb-3" style="color: #1c75bc;">Informasi Akun</h6>

                    <label class="form-label">Email</label>
                    <input type="text"
                        class="form-control"
                        value="{{ current_user.email }}"
                        disabled>

                    <small class="text-muted d-block mt-2">
                        Email tidak dapat diubah.
                    </small>
                </div>
            </div>

            <div class="card bg-white text-dark shadow-sm"
                style="border-radius: 20px; border: 1px solid #e3e8f0;">
                <div class="card-body">
                    <h6 class="text-uppercase mb-3" style="color: #1c75bc;">Ubah Password</h6>

                    <form method="POST" action="{{ url_for('auth.update_password') }}">

                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Password Saat Ini</label>
                            <div class="input-group">
                                <input type="password"
                                    name="current_password"
                                    id="current_password"
                                    class="form-control"
                                    placeholder="Masukkan password saat ini"
                                    required>
                                <button class="btn btn-outline-secondary toggle-password" type="button" data-target="current_password">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Password Baru</label>
                            <div class="input-group">
                                <input type="password"
                                    name="new_password"
                                    id="new_password"
                                    class="form-control"
                                    placeholder="Masukkan password baru"
                                    minlength="6"
                                    required>
                                <button class="btn btn-outline-secondary toggle-password" type="button" data-target="new_password">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold small">Konfirmasi Password Baru</label>
                            <div class="input-group">
                                <input type="password"
                                    name="confirm_password"
                                    id="confirm_password"
                                    class="form-control"
                                    placeholder="Konfirmasi password baru"
                                    required>
                                <button class="btn btn-outline-secondary toggle-password" type="button" data-target="confirm_password">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn w-100 text-white" style="background-color: #1c75bc; border-color: #1c75bc;">
                            <i class="fa-solid fa-lock me-2"></i>Simpan Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.querySelectorAll(".toggle-password").forEach(function (button) {
    button.addEventListener("click", function () {
        var targetId = this.getAttribute("data-target");
        var input = document.getElementById(targetId);
        var icon = this.querySelector("i");
        var isHidden = input.type === "password";
        input.type = isHidden ? "text" : "password";
        icon.classList.toggle("fa-eye");
        icon.classList.toggle("fa-eye-slash");
    });
});
</script>
{% endblock %}
