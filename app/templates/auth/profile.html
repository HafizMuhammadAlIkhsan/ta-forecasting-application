{% extends "base.html" %}
{% block title %}Profil{% endblock %}

{% block content %}
<div style="padding: 2rem 2.5rem;">

    <div class="mb-4">
        <h4 class="fw-bold mb-1">Profil Pengguna</h4>
        <p class="text-muted small mb-0">Kelola Keamanan Akun</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">

                    <h6 class="fw-bold mb-1">Update Password</h6>
                    <p class="text-muted small mb-4">Pastikan menggunakan password yang kuat</p>

                    <form method="POST" action="{{ url_for('auth.update_password') }}">

                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Password Saat Ini</label>
                            <div class="input-group">
                                <input type="password"
                                    name="current_password"
                                    id="current_password"
                                    class="form-control"
                                    placeholder="Masukkan password saat ini"
                                    required>
                                <button class="btn btn-outline-secondary toggle-password" type="button" data-target="current_password">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Password Baru</label>
                            <div class="input-group">
                                <input type="password"
                                    name="new_password"
                                    id="new_password"
                                    class="form-control"
                                    placeholder="Masukkan password baru"
                                    minlength="6"
                                    required>
                                <button class="btn btn-outline-secondary toggle-password" type="button" data-target="new_password">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold small">Konfirmasi Password Baru</label>
                            <div class="input-group">
                                <input type="password"
                                    name="confirm_password"
                                    id="confirm_password"
                                    class="form-control"
                                    placeholder="Konfirmasi password baru"
                                    required>
                                <button class="btn btn-outline-secondary toggle-password" type="button" data-target="confirm_password">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fa-solid fa-lock me-2"></i>Simpan Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.querySelectorAll(".toggle-password").forEach(function (button) {
    button.addEventListener("click", function () {
        var targetId = this.getAttribute("data-target");
        var input = document.getElementById(targetId);
        var icon = this.querySelector("i");
        var isHidden = input.type === "password";
        input.type = isHidden ? "text" : "password";
        icon.classList.toggle("fa-eye");
        icon.classList.toggle("fa-eye-slash");
    });
});
</script>
{% endblock %}
