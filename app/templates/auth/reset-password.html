{% extends "base.html" %}
{% set hide_chrome = true %}
{% block title %}Login — ForecastNet{% endblock %}
{% block content %}
<div class="container-fluid vh-100 d-flex align-items-center justify-content-center" style="background-color: #1c75bc;">
    <div
        class="card shadow-lg bg-white text-dark"
        style="width: 500px; border-radius: 20px;"
    >
        <div class="card-body p-5">

            <div class="text-center mb-3">
                <div class="d-inline-flex justify-content-center align-items-center rounded" style="width:60px;height:60px;background-color:#1c75bc;font-size:30px;">
                    <i class="fa-solid fa-display text-white"></i>
                </div>
            </div>

            <h2 class="fw-bold text-left mb-2">Reset Password</h2>

            <p class="text-left mb-4" style="color: #5a6b7d;">Masukan password baru</p>

            <form method="POST">
                <div class="mb-3">
                    <label for="password" class="form-label">Password Baru</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
                        <button class="btn btn-outline-secondary toggle-password" type="button"
                                data-target="password">
                            <i class="fa fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label">Konfirmasi Password Baru</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="••••••••" required>
                        <button class="btn btn-outline-secondary toggle-password" type="button"
                                data-target="confirm_password">
                            <i class="fa fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn w-100 py-2 text-white" style="background-color: #1c75bc; border-color: #1c75bc;">
                    Simpan Password
                </button>
            </form>

        </div>
    </div>
</div>

<script>
    document.querySelectorAll(".toggle-password").forEach(button => {
        button.addEventListener("click", function () {
            const targetId = this.getAttribute("data-target");
            const input = document.getElementById(targetId);
            const icon = this.querySelector("i");

            const isHidden = input.type === "password";

            input.type = isHidden ? "text" : "password";

            icon.classList.toggle("fa-eye");
            icon.classList.toggle("fa-eye-slash");
        });
    });
</script>
{% endblock %}
