{% extends "base.html" %}
{% set hide_chrome = true %}
{% block title %}Login — ForecastNet{% endblock %}
{% block content %}
<div class="container vh-100 d-flex align-items-center justify-content-center">
    <div
        class="card border-secondary shadow-lg bg-dark text-light"
        style="width: 500px; border-radius: 20px;"
    >
        <div class="card-body p-5">

            <div class="text-center mb-3">
                <div class="d-inline-flex justify-content-center align-items-center bg-white rounded" style="width:60px;height:60px;font-size:30px;">
                    📈
                </div>
            </div>

            <h2 class="fw-bold text-left mb-2">Reset Password</h2>

            <p class="text-secondary text-left mb-4">Masukan password baru</p>

            <form method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label">Password Baru</label>
                    <div class="input-group">
                        <input type="password" name="password" id="password" class="form-control mb-3" placeholder="••••••••" required>
                        <button class="btn btn-outline-secondary toggle-password mb-3" type="button"
                                data-target="password">
                            <i class="fa fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Konfirmasi Password Baru</label>
                    <div class="input-group">
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control mb-3" placeholder="••••••••" required>
                        <button class="btn btn-outline-secondary toggle-password mb-3" type="button"
                                data-target="confirm_password">
                            <i class="fa fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">
                    Simpan Password
                </button>
            </form>

        </div>
    </div>
</div>

<script>
    document.querySelectorAll(".toggle-password").forEach(button => {
        button.addEventListener("click", function () {
            const targetId = this.getAttribute("data-target");
            const input = document.getElementById(targetId);
            const icon = this.querySelector("i");

            const isHidden = input.type === "password";

            input.type = isHidden ? "text" : "password";

            icon.classList.toggle("fa-eye");
            icon.classList.toggle("fa-eye-slash");
        });
    });
</script>
{% endblock %}
