{% extends "base.html" %}
{% set hide_chrome = true %}
{% block title %}Login — ForecastNet{% endblock %}
{% block content %}
<div class="container-fluid vh-100 d-flex align-items-center justify-content-center" style="background-color: #1c75bc;">
    <div
        class="card shadow-lg bg-white text-dark"
        style="width: 500px; border-radius: 20px;"
    >
        <div class="card-body p-5">

            <div class="text-center mb-3">
                <div class="d-inline-flex justify-content-center align-items-center rounded" style="width:60px;height:60px;background-color:#1c75bc;font-size:30px;">
                    <i class="fa-solid fa-display text-white"></i>
                </div>
            </div>

            <h2 class="fw-bold text-center mb-2">ForecastNet</h2>

            <p class="text-center mb-4" style="color: #5a6b7d;">Net Demand &amp; Server Utilization Forecasting</p>

            <form method="POST">

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fa-solid fa-envelope text-muted"></i></span>
                        <input type="email" id="email" name="email" class="form-control" placeholder="user@example.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>

                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input type="password" id="password" name="password"
                            class="form-control"
                            placeholder="••••••••" required>

                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="fa fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-4 text-end">
                    <a class="text-decoration-none text-right" style="color: #1c75bc;" href="{{ url_for('auth.forgot_password') }}">Lupa Password?</a>
                </div>

                <button type="submit" class="btn w-100 py-2 text-white" style="background-color: #1c75bc; border-color: #1c75bc;">
                    Masuk
                </button>

            </form>

        </div>
    </div>
</div>

<script>
    const togglePassword = document.getElementById("togglePassword");
    const password = document.getElementById("password");
    const eyeIcon = document.getElementById("eyeIcon");

    togglePassword.addEventListener("click", function () {
        const isHidden = password.getAttribute("type") === "password";

        password.setAttribute("type", isHidden ? "text" : "password");

        eyeIcon.classList.toggle("fa-eye");
        eyeIcon.classList.toggle("fa-eye-slash");
    });
</script>
{% endblock %}
