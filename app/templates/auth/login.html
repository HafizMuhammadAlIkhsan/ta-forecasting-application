{% extends "base.html" %}
{% block title %}Login — ForecastNet{% endblock %}
{% block content %}
<div class="container vh-100 d-flex align-items-center justify-content-center">
    <div
        class="card border-secondary shadow-lg bg-dark text-light"
        style="width: 500px; border-radius: 20px;"
    >
        <div class="card-body p-5">

            <div class="text-center mb-3">
                <div class="d-inline-flex justify-content-center align-items-center bg-white rounded" style="width:60px;height:60px;font-size:30px;">
                    📈
                </div>
            </div>

            <h2 class="fw-bold text-center mb-2">ForecastNet</h2>

            <p class="text-secondary text-center mb-4">Net Demand &amp; Server Utilization Forecasting</p>

            <form method="POST">

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-control bg-secondary-subtle" placeholder="user@example.com" required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control bg-secondary-subtle" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">
                    Masuk
                </button>

            </form>

        </div>
    </div>
</div>
{% endblock %}
