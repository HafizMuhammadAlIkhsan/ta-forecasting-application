{% extends "base.html" %}
{% set hide_chrome = true %}
{% block title %}Login — ForecastNet{% endblock %}
{% block content %}
<div class="container vh-100 d-flex align-items-center justify-content-center">
    <div
        class="card border-secondary shadow-lg bg-dark text-light"
        style="width: 500px; border-radius: 20px;"
    >
        <div class="card-body p-5">

            <div class="text-center mb-3">
                <div class="d-inline-flex justify-content-center align-items-center bg-white rounded" style="width:60px;height:60px;font-size:30px;">
                    📈
                </div>
            </div>

            <h2 class="fw-bold text-left mb-2">Masukan Kode OTP</h2>

            <p class="text-secondary text-left mb-4">Kode OTP telah dikirim ke email Anda</p>

            <!-- <form method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label">Kode OTP</label>
                    <input type="text" name="otp" class="form-control" placeholder="Masukkan OTP" required>
                </div>
                

                <button type="submit" class="btn btn-primary w-100 py-2">
                    Verifikasi
                </button>
            </form> -->

            <form method="POST" id="otpForm">

                <div class="d-flex justify-content-center gap-2 mb-4">
                    <input type="text" maxlength="1" class="otp-input form-control text-center fs-4 fw-bold" style="width:60px;height:60px;">

                    <input type="text" maxlength="1" class="otp-input form-control text-center fs-4 fw-bold" style="width:60px;height:60px;">

                    <input type="text" maxlength="1" class="otp-input form-control text-center fs-4 fw-bold" style="width:60px;height:60px;">

                    <input type="text" maxlength="1" class="otp-input form-control text-center fs-4 fw-bold" style="width:60px;height:60px;">

                    <input type="text" maxlength="1" class="otp-input form-control text-center fs-4 fw-bold" style="width:60px;height:60px;">

                    <input type="text" maxlength="1" class="otp-input form-control text-center fs-4 fw-bold" style="width:60px;height:60px;">

                </div>

                <input type="hidden" name="otp" id="otp">

                <button type="submit" class="btn btn-primary w-100 py-2">
                    Verifikasi
                </button>

            </form>

        </div>
    </div>
</div>

<script>

const inputs = document.querySelectorAll('.otp-input');
const hiddenOtp = document.getElementById('otp');

inputs.forEach((input, index) => {

    input.addEventListener('input', (e) => {

        e.target.value = e.target.value.replace(/[^0-9]/g, '');

        if (e.target.value && index < inputs.length - 1) {
            inputs[index + 1].focus();
        }

        updateOtp();
    });

    input.addEventListener('keydown', (e) => {

        if (e.key === 'Backspace' &&
            !e.target.value &&
            index > 0) {
            inputs[index - 1].focus();
        }
    });

});

function updateOtp() {

    let otp = '';

    inputs.forEach(input => {
        otp += input.value;
    });

    hiddenOtp.value = otp;
}

</script>

<script>
    const togglePassword = document.getElementById("togglePassword");
    const password = document.getElementById("password");
    const eyeIcon = document.getElementById("eyeIcon");

    togglePassword.addEventListener("click", function () {
        const isHidden = password.getAttribute("type") === "password";

        password.setAttribute("type", isHidden ? "text" : "password");

        eyeIcon.classList.toggle("fa-eye");
        eyeIcon.classList.toggle("fa-eye-slash");
    });
</script>
{% endblock %}
